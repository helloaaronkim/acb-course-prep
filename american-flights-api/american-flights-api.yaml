openapi: 3.0.0
info:
    version: 1.1.0
    title: American Flights API
paths:
    /flights: 
        get:
            parameters:
                - name: destination
                  in: query
                  required: false
                  schema:
                    type: string
                    enum:
                        - SFO
                        - LAX
                        - CLE
            responses:
                "200":
                    description:
                    content:
                        application/json:
                            schema:
                                $ref: 'components/schemas.yaml#/components/schemas/AmericanFlights'
                            examples:
                                AmericanFlightsResponse:
                                    $ref: 'components/examples.yaml#/components/examples/AmericanFlightsResponse'
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: 'components/schemas.yaml#/components/schemas/AmericanFlight'
                        examples:
                            AmericanFlightsRequest:
                                $ref: 'components/examples.yaml#/components/examples/AmericanFlightRequest'
            responses:
                "201":
                    description:
                    content:
                        application/json:
                            schema:
                                type: object
                            example:
                                message: Flight added successfully (but not really)
    /flights/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
        get:
            responses:
                "200":
                    description:
                    content:
                        application/json:
                            schema:
                                $ref: 'components/schemas.yaml#/components/schemas/AmericanFlight'
                            examples:
                                AmericanFlightResponse:
                                    $ref: 'components/examples.yaml#/components/examples/AmericanFlightResponse'
        delete:
            responses:
                "200":
                    description: 
                    content:
                        application/json:
                            schema:
                                type: object
                            example: 
                                message: Flight deleted (but not really)                    