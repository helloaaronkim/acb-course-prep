<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Arrive at Mule United Airport — DEX401 Big Picture</title>
<meta name="description" content="DEX401 wrap-up: Mule applications and application networks in the Agentic Enterprise. 日本語 / 한국어 / English">
<style>
  :root {
    --bg: #f6f7fb; --surface: #fff; --ink: #1b2333; --muted: #5b6475; --line: #dde2ec;
    --navy: #0b1f3a; --blue: #0176d3; --blue-soft: #e6f1fc;
    --amber: #f2a900; --amber-soft: #fff6dc; --violet: #6b4fbb; --violet-soft: #efeafb;
    --green: #2e844a; --red: #ba0517; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; font-size: 17px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", "Malgun Gothic", Meiryo, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 24px; background: rgba(11,31,58,.96); color: #fff;
  }
  .brand { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--amber); }
  .lang-switch { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; overflow: hidden; }
  .lang-switch button { appearance: none; border: 0; background: none; color: #fff; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .lang-switch button[aria-pressed="true"] { background: var(--amber); color: var(--navy); font-weight: 700; }

  /* hero */
  .hero { background: radial-gradient(1000px 360px at 85% -10%, #1d4f8f, transparent 60%), var(--navy); color: #fff; padding: 56px 24px 60px; }
  .board { display: inline-flex; gap: 6px; margin-bottom: 18px; font: 13px ui-monospace, Menlo, monospace; }
  .board span { background: #000; color: var(--amber); padding: 4px 8px; border-radius: 4px; letter-spacing: .08em; }
  .board .ok { color: #6ee7a8; }
  .hero h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.2; margin: 0 0 18px; }
  .hero p { margin: 0; font-size: clamp(17px, 2.3vw, 22px); font-weight: 600; border-left: 4px solid var(--amber); padding-left: 16px; color: #e3ebf7; }

  /* sections */
  section { padding: 56px 24px; }
  section:nth-of-type(even) { background: var(--surface); }
  .eyebrow { color: var(--blue); font-weight: 700; font-size: 13px; letter-spacing: .12em; margin: 0 0 4px; }
  h2 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.3; margin: 0 0 6px; }
  .cap { color: var(--muted); margin: 0 0 24px; font-size: 18px; }
  .cap b { color: var(--navy); }

  .viz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; }
  section:nth-of-type(even) .viz { background: var(--bg); }
  .viz svg { display: block; width: 100%; height: auto; min-width: 720px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }

  /* shared svg text styles */
  svg text { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", sans-serif; }
  .t1 { font-size: 14px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .t2 { font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
  .t3 { font-size: 16px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
  .lyr { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: .06em; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important; }
  .ln { stroke: #9aa3b2; stroke-width: 1.6; fill: none; }

  /* chat */
  .scene { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; align-items: center; }
  @media (max-width: 860px) { .scene { grid-template-columns: 1fr; } }
  .chat { display: grid; gap: 10px; }
  .bubble { padding: 12px 16px; border-radius: 16px; max-width: 92%; font-size: 16px; }
  .bubble.user { justify-self: end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.agent { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble small { display: block; font-size: 12px; font-weight: 700; opacity: .75; }
  .scene .viz svg { min-width: 0; }

  /* trace */
  #net [data-n] { transition: opacity .25s; }
  #net.tracing [data-n] { opacity: .14; }
  #net.tracing [data-n].hl { opacity: 1; }
  #net.tracing [data-n].hl .ln { stroke: var(--amber); stroke-width: 3; }
  .tracer { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin-top: 14px;
    background: var(--navy); color: #fff; border-radius: var(--radius); padding: 14px 16px; }
  .tracer button { appearance: none; border: 0; border-radius: 10px; background: rgba(255,255,255,.12); color: #fff;
    font: inherit; font-size: 15px; padding: 8px 14px; cursor: pointer; }
  .tracer button:hover { background: rgba(255,255,255,.22); }
  .tracer button:disabled { opacity: .35; cursor: default; }
  .step-text { min-height: 2.8em; display: flex; align-items: center; gap: 12px; }
  .step-no { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--amber); color: var(--navy);
    font: 700 16px ui-monospace, Menlo, monospace; display: grid; place-items: center; }
  .step-no.zero { background: rgba(255,255,255,.15); color: #fff; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #c3cad6; cursor: pointer; }
  .dots button[aria-current="true"] { background: var(--amber); transform: scale(1.3); }

  /* formula */
  .formula { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 10px; }
  .tile { flex: 1 1 150px; max-width: 200px; text-align: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 12px; }
  .tile .ic { font-size: 34px; line-height: 1; }
  .tile b { display: block; margin-top: 8px; font-size: 16px; }
  .tile span { color: var(--muted); font-size: 15px; }
  .op { align-self: center; font-size: 28px; font-weight: 800; color: var(--muted); }
  .tile.result { background: var(--navy); color: #fff; border-color: var(--navy); max-width: 240px; }
  .tile.result span { color: var(--amber); }
  .final { text-align: center; margin: 28px auto 0; max-width: 760px; font-size: clamp(18px, 2.4vw, 22px); font-weight: 700; }
  .final em { font-style: normal; color: var(--blue); }

  footer { padding: 28px 24px 48px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--blue); margin-right: 14px; }

  @media (max-width: 640px) {
    section { padding: 44px 16px; }
    .tracer { grid-template-columns: 1fr 1fr; }
    .tracer .step-text { grid-column: 1 / -1; grid-row: 1; }
  }
</style>

    ["brk", 322, 98, 196, 58, "Agent Broker", "Agent Networks", "fab"],
    ["gw", 522, 98, 196, 58, "Omni Gateway", "policies", "fab"],
    ["vis", 722, 98, 196, 58, "Agent Visualizer", "observe", "fab"],
    ["web", 135, 188, 160, 48, "Web / Mobile API", { t: "n.human" }, "api"],
    ["fmcp", 305, 188, 170, 48, "Flights MCP Server", "MCP Bridge", "api"],
    ["rmcp", 490, 188, 190, 48, "Rebooking MCP Server", "MCP Bridge", "api"],
    ["wx", 730, 188, 180, 48, "Weather MCP Server", { t: "n.saas" }, "ext"],
    ["fl", 275, 282, 170, 48, "Flights API", { t: "n.you2" }, "you2"],
    ["rb", 575, 282, 170, 48, "Rebooking API", { t: "n.rebook" }, "api"],
    ["am", 125, 376, 170, 48, "American Flights API", { t: "n.you" }, "you"],
    ["de", 325, 376, 170, 48, "Delta Flights", "SOAP Web Service", "api"],
    ["un", 525, 376, 170, 48, "United Flights", "REST Web Service", "api"],

    ["db", 125, 482, 170, 46, "MySQL", "American", "be"],
    ["soap", 325, 482, 170, 46, "Delta", { t: "n.ws" }, "be"],
    ["rest", 525, 482, 170, 46, "United", { t: "n.ws" }, "be"],
    ["sf", 725, 482, 170, 46, "Salesforce", "Accounts", "be"]
  ];
  var STYLE = {
    agent: { fill: "#fff", stroke: "#6b4fbb", sw: 1.5 },
    fab:   { fill: "#0b1f3a", stroke: "#0b1f3a", sw: 1, t1: "#f2a900", t2: "#c9d6ea" },
    api:   { fill: "#fff", stroke: "#0176d3", sw: 1.5 },
    you:   { fill: "#fff6dc", stroke: "#f2a900", sw: 3, t2: "#8a5d00" },
    you2:  { fill: "#e3f5f3", stroke: "#0b827c", sw: 3, t2: "#0b827c" },
    be:    { fill: "#fff", stroke: "#aab2c0", sw: 1.5 },
    ext:   { fill: "#fff", stroke: "#5b6475", sw: 1.5, dash: "5 4" }
  };
  (function () {
    var root = document.getElementById("net-nodes");
    NODES.forEach(function (n) {
      var s = STYLE[n[7]];
      var g = el("g", { "data-n": "", id: n[0] }, root);
      var r = { x: n[1], y: n[2], width: n[3], height: n[4], rx: 10, fill: s.fill, stroke: s.stroke, "stroke-width": s.sw };
      if (s.dash) r["stroke-dasharray"] = s.dash;
      el("rect", r, g);
      if (n[7] === "ext") {
        el("rect", { x: n[1] + n[3] - 62, y: n[2] - 9, width: 60, height: 17, rx: 8, fill: "#5b6475" }, g);
        label(g, n[1] + n[3] - 32, n[2] + 3, "t2", "3rd party", "fill:#fff;font-weight:700;font-size:10px");
      }
      var cx = n[1] + n[3] / 2, top = n[2] + n[4] / 2;
      label(g, cx, top - 2, "t1", n[5], s.t1 ? "fill:" + s.t1 : null);
      label(g, cx, top + 15, "t2", n[6], s.t2 ? "fill:" + s.t2 + (n[7].indexOf("you") === 0 ? ";font-weight:700" : "") : null);
    });
  })();

  var STEPS = [
    null,
    ["pa"],
    ["pa", "e-pa", "reg"],
    ["pa", "e-pa", "gw", "e-gw-wx", "wx"],
    ["pa", "e-pa", "gw", "e-gw-fmcp", "fmcp"],
    ["fmcp", "e-fl-fmcp", "fl", "e-am-fl", "e-de-fl", "e-un-fl", "am", "de", "un"],
    ["am", "e-db-am", "db"],
    ["pa", "brk", "e-a2a1", "bag", "e-bag"],
    ["pa", "e-pa", "gw", "e-gw-rmcp", "rmcp", "e-rb-rmcp", "rb", "e-ac-rb", "ac", "e-sf-ac", "sf"],
    ["vis", "pa", "e-pa", "gw", "brk", "reg", "e-gw-fmcp", "e-gw-rmcp", "fmcp", "rmcp", "e-fl-fmcp", "e-rb-rmcp", "fl", "rb", "e-am-fl", "e-de-fl", "e-un-fl", "e-ac-rb", "am", "de", "un", "ac", "e-db-am", "e-soap-de", "e-rest-un", "e-sf-ac", "db", "soap", "rest", "sf", "e-a2a1", "bag", "e-bag", "e-gw-wx", "wx"]
  ];
  var step = 0;
  var net = document.getElementById("net");
  var dots = document.getElementById("dots");
  STEPS.forEach(function (_, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Step " + i);
    b.addEventListener("click", function () { go(i); });
    dots.appendChild(b);
  });
  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    var ids = STEPS[step];
    net.classList.toggle("tracing", !!ids);
    net.querySelectorAll("[data-n]").forEach(function (n) {
      n.classList.toggle("hl", !!ids && ids.indexOf(n.id) >= 0);
    });
    var no = document.getElementById("step-no");
    no.textContent = step;
    no.classList.toggle("zero", step === 0);
    document.getElementById("step-text").textContent = tr("st" + step);
    document.getElementById("prev").disabled = step === 0;
    document.getElementById("next").disabled = step === STEPS.length - 1;
    dots.querySelectorAll("button").forEach(function (b, j) { b.setAttribute("aria-current", String(j === step)); });
  }
  document.getElementById("prev").addEventListener("click", function () { go(step - 1); });
  document.getElementById("next").addEventListener("click", function () { go(step + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") go(step + 1);
    if (e.key === "ArrowLeft") go(step - 1);
  });

  /* ================= 5. sprawl vs fabric ================= */
  (function () {
    var g = document.getElementById("sprawl");
    function panel(ox, mode) {
      el("rect", { x: ox, y: 10, width: 470, height: 280, rx: 16, fill: "#fff", stroke: mode ? "#0176d3" : "#f0b4b9", "stroke-width": 1.5 }, g);
      label(g, ox + 235, 40, "t3", { t: mode ? "sp.after" : "sp.before" }, mode ? "fill:#0176d3" : "fill:#ba0517");
      label(g, ox + 235, 60, "t2", { t: mode ? "sp.after2" : "sp.before2" });
      var A = [0, 1, 2, 3].map(function (i) { return [ox + 130 + i * 95, 100]; });
      var P = [0, 1, 2, 3, 4].map(function (i) { return [ox + 130 + i * 72, 250]; });
      if (!mode) {
        var links = [[0,0],[0,1],[0,3],[1,0],[1,2],[1,4],[2,1],[2,2],[2,3],[3,0],[3,3],[3,4],[0,4],[2,0]];
        links.forEach(function (l) {
          el("line", { x1: A[l[0]][0], y1: A[l[0]][1] + 16, x2: P[l[1]][0], y2: P[l[1]][1] - 14, stroke: "#e08a92", "stroke-width": 1.4 }, g);
        });
      } else {
        el("rect", { x: ox + 100, y: 160, width: 350, height: 40, rx: 10, fill: "#0b1f3a" }, g);
        label(g, ox + 275, 186, "t1", "Agent Fabric", "fill:#f2a900");
        A.forEach(function (a) { el("line", { x1: a[0], y1: a[1] + 16, x2: a[0], y2: 160, "class": "ln", style: "stroke:#0176d3" }, g); });
        P.forEach(function (p) { el("line", { x1: p[0], y1: 200, x2: p[0], y2: p[1] - 14, "class": "ln", style: "stroke:#0176d3" }, g); });
      }
      A.forEach(function (a) {
        el("circle", { cx: a[0], cy: a[1], r: 16, fill: "#efeafb", stroke: "#6b4fbb", "stroke-width": 1.5 }, g);
        el("text", { x: a[0], y: a[1] + 6, style: "font-size:16px;text-anchor:middle" }, g, "🤖");
      });
      P.forEach(function (p) {
        el("rect", { x: p[0] - 16, y: p[1] - 14, width: 32, height: 28, rx: 6, fill: "#e6f1fc", stroke: "#0176d3", "stroke-width": 1.5 }, g);
      });
      if (!mode) {
        el("text", { x: ox + 275, y: 186, style: "font-size:28px;font-weight:800;fill:#ba0517;text-anchor:middle" }, g, "?");
      }
      label(g, ox + 22, 104, "t2", { t: "sp.agents" }, "text-anchor:start;font-size:10px");
      label(g, ox + 22, 282, "t2", { t: "sp.tools" }, "text-anchor:start;font-size:10px");
    }
    panel(10, false);
    el("text", { x: 500, y: 160, style: "font-size:26px;font-weight:800;fill:#5b6475;text-anchor:middle" }, g, "→");
    panel(520, true);
  })();

  /* ================= 5b. bridge ================= */
  (function () {
    var g = document.getElementById("bridge");
    var rows = [
      ["b.l1", "Discover", "Registry", "b.r1", "#0176d3"],
      ["b.l2", "Expose", "MCP / A2A Bridge", "b.r2", "#0176d3"],
      ["b.l3", "Orchestrate", "Agent Broker", "b.r3", "#6b4fbb"],
      ["b.l4", "Govern", "Omni Gateway", "b.r4", "#0b827c"],
      ["b.l5", "Control", "Model Proxy", "b.r5", "#8a5d00"],
      ["b.l6", "Observe", "Agent Visualizer", "b.r6", "#0b827c"]
    ];
    rows.forEach(function (r, i) {
      var y = 66 + i * 64;
      // left: what we do for APIs
      el("rect", { x: 20, y: y, width: 340, height: 50, rx: 12, fill: "#e6f1fc", stroke: "#0176d3", "stroke-width": 1.2 }, g);
      el("text", { x: 46, y: y + 32, style: "font-size:17px;text-anchor:middle" }, g, "📄");
      label(g, 66, y + 31, "t1", { t: r[0] }, "text-anchor:start");
      // shared verb
      el("line", { x1: 360, y1: y + 25, x2: 640, y2: y + 25, "class": "ln", style: "stroke:" + r[4] + ";stroke-width:2.2" }, g);
      el("rect", { x: 440, y: y + 11, width: 120, height: 28, rx: 14, fill: r[4] }, g);
      label(g, 500, y + 30, "t2", r[1], "fill:#fff;font-weight:700;font-size:12.5px");
      // right: the same for agents
      el("rect", { x: 640, y: y, width: 340, height: 50, rx: 12, fill: "#0b1f3a" }, g);
      el("text", { x: 666, y: y + 32, style: "font-size:17px;text-anchor:middle" }, g, "🤖");
      label(g, 688, y + 22, "t1", r[2], "text-anchor:start;fill:#f2a900");
      label(g, 688, y + 40, "t2", { t: r[3] }, "text-anchor:start;fill:#c9d6ea");
    });
    // future
    var fy = 66 + 6 * 64 + 6;
    el("path", { d: "M500," + (fy - 8) + " v14", "class": "ln" }, g);
    el("rect", { x: 20, y: fy + 8, width: 960, height: 56, rx: 14, fill: "#fff6dc", stroke: "#f2a900", "stroke-width": 2 }, g);
    el("text", { x: 52, y: fy + 44, style: "font-size:22px;text-anchor:middle" }, g, "📈");
    label(g, 520, fy + 42, "t1", { t: "b.future" }, "font-size:16px");
  })();

  /* ================= i18n ================= */
  var SUPPORTED = ["ja", "ko", "en"];
  var TITLES = {
    ja: "エージェントがやってきた Mule United Airport — DEX401",
    ko: "에이전트가 찾아온 Mule United Airport — DEX401",
    en: "Agents Arrive at Mule United Airport — DEX401"
  };
  var lang = "ja";
  function tr(k) { return T[k] ? T[k][lang] : k; }
  function apply(l) {
    lang = l;
    document.body.setAttribute("data-lang", l);
    document.documentElement.setAttribute("lang", l);
    document.title = TITLES[l];
    document.querySelectorAll("[data-t]").forEach(function (e) {
      var v = tr(e.getAttribute("data-t"));
      if (e instanceof SVGElement) e.textContent = v; else e.innerHTML = v;
    });
    document.querySelectorAll("[data-set-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-set-lang") === l));
    });
    go(step);
    try { localStorage.setItem("lang", l); } catch (e) {}
    var url = new URL(location.href);
    url.searchParams.set("lang", l);
    history.replaceState(null, "", url);
  }
  function pick() {
    var q = new URLSearchParams(location.search).get("lang");
    if (SUPPORTED.indexOf(q) >= 0) return q;
    try { var s = localStorage.getItem("lang"); if (SUPPORTED.indexOf(s) >= 0) return s; } catch (e) {}
    var n = (navigator.language || "").slice(0, 2).toLowerCase();
    return SUPPORTED.indexOf(n) >= 0 ? n : "ja";
  }
  document.querySelectorAll("[data-set-lang]").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-set-lang")); });
  });
  apply(pick());
  var m = location.hash.match(/^#step-(\d+)$/);
  if (m) { go(+m[1]); document.getElementById("net").scrollIntoView(); }
})();
